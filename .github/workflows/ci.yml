name: ci

env:
  FNPACK_VERSION: 1.2.3
  FNPACK_SHA256: 54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install official fnpack
        run: |
          curl --fail --location --silent --show-error \
            "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64" \
            --output /tmp/fnpack
          printf '%s  %s\n' "$FNPACK_SHA256" /tmp/fnpack | sha256sum --check --strict
          sudo install -m 0755 /tmp/fnpack /usr/local/bin/fnpack
      - name: Test
        run: make verify
      - name: Build FPK
        run: make fpk COMMIT="$GITHUB_SHA" BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - uses: actions/upload-artifact@v5
        with:
          name: dockfn-fpk
          path: |
            dist/fpk/dockfn-*-x86_64.fpk
            dist/fpk/dockfn-*-arm64.fpk
            dist/SHA256SUMS

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install official fnpack
        run: |
          curl --fail --location --silent --show-error \
            "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64" \
            --output /tmp/fnpack
          printf '%s  %s\n' "$FNPACK_SHA256" /tmp/fnpack | sha256sum --check --strict
          sudo install -m 0755 /tmp/fnpack /usr/local/bin/fnpack
      - name: Build release
        run: make fpk VERSION="${GITHUB_REF_NAME#v}" COMMIT="$GITHUB_SHA" BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/fpk/*.fpk dist/SHA256SUMS --generate-notes
